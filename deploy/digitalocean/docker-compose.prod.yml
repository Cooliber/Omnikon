version: "3.9"

services:
  frontend:
    build:
      context: ../../
      dockerfile: deploy/digitalocean/Dockerfile.frontend
    container_name: motia-frontend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_RESEARCH_PROXY_BASE=https://api.${DOMAIN}/research
      - VITE_CONVEX_HTTP_URL=https://api.${DOMAIN}/convex
      - VITE_CONVEX_FORM_ENDPOINT=/forms/submit
      - VITE_CONVEX_SHAPES_ENDPOINT=/shapes/save
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - motia-prod

  research-proxy:
    build:
      context: ../../services/research-proxy
    container_name: research-proxy-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8787
    env_file:
      - .env.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.research.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/research`)"
      - "traefik.http.routers.research.tls=true"
      - "traefik.http.routers.research.tls.certresolver=letsencrypt"
      - "traefik.http.services.research.loadbalancer.server.port=8787"
    networks:
      - motia-prod

  convex-proxy:
    build:
      context: ../../services/convex-mock
    container_name: convex-proxy-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CONVEX_DEPLOYMENT_URL=${CONVEX_DEPLOYMENT_URL}
    env_file:
      - .env.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.convex.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/convex`)"
      - "traefik.http.routers.convex.tls=true"
      - "traefik.http.routers.convex.tls.certresolver=letsencrypt"
      - "traefik.http.services.convex.loadbalancer.server.port=3001"
    networks:
      - motia-prod

  raynet-adapter:
    build:
      context: ../../services/raynet-adapter
    container_name: raynet-adapter-prod
    restart: unless-stopped
    environment:
      - PORT=8000
    env_file:
      - .env.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.raynet.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/raynet`)"
      - "traefik.http.routers.raynet.tls=true"
      - "traefik.http.routers.raynet.tls.certresolver=letsencrypt"
      - "traefik.http.services.raynet.loadbalancer.server.port=8000"
    networks:
      - motia-prod

  traefik:
    image: traefik:v3.0
    container_name: traefik-prod
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}"
    networks:
      - motia-prod

volumes:
  letsencrypt:
    driver: local

networks:
  motia-prod:
    driver: bridge
